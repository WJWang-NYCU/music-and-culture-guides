<h1>樂章之間</h1>
<p class="lead">一個關於古典音樂、音樂會、電影、藝術與文化的閱讀計畫。</p>
<p>本站把背景資料、作品線索與可直接聆聽的連結放在一起，讓閱讀成為走近作品的一種方法。每篇文章保留來源與必要的年代說明；原始資料也隨專案保存，方便日後追溯與編修。</p>
